<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI 技术热词时间线 · AI Tech Buzzword Timeline</title>
<style>
  :root{
    --ink:#1d1d1f;
    --ink-2:#48484a;
    --ink-3:#8e8e93;
    --line:rgba(0,0,0,.08);
    --glass:rgba(255,255,255,.72);
    --bg:#f5f5f7;
    --green:#34c759;
    --orange:#ff9500;
    --gray:#aeaeb2;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(99,102,241,.10), transparent 60%),
      radial-gradient(1000px 500px at -10% 20%, rgba(52,199,89,.08), transparent 60%),
      radial-gradient(900px 700px at 50% 110%, rgba(255,149,0,.07), transparent 60%),
      var(--bg);
    height:100vh;overflow:hidden;
    display:flex;flex-direction:column;
  }
  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    backdrop-filter:blur(20px) saturate(1.6);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
    background:var(--glass);
    border-bottom:1px solid var(--line);
    padding:14px 28px;
    display:flex;align-items:center;gap:24px;flex-wrap:wrap;
    z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand svg{flex:0 0 auto}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .search{
    position:relative;flex:0 1 300px;min-width:200px;margin-left:auto;
  }
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
  .search input{
    width:100%;height:34px;padding:0 12px 0 32px;
    border:1px solid var(--line);border-radius:10px;
    background:rgba(255,255,255,.8);
    font-size:13px;color:var(--ink);outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
  /* ---------- Layout ---------- */
  .layout{flex:1 1 auto;display:flex;min-height:0}
  /* Sidebar */
  aside{
    flex:0 0 232px;
    border-right:1px solid var(--line);
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(1.6);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
    padding:20px 16px;overflow-y:auto;
  }
  .side-title{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.8px;margin:18px 6px 8px}
  .side-title:first-child{margin-top:0}
  .year-item{
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;border-radius:9px;cursor:pointer;
    font-size:13px;color:var(--ink-2);text-decoration:none;
    transition:background .15s,color .15s;
  }
  .year-item:hover{background:rgba(0,0,0,.05)}
  .year-item.active{background:var(--ink);color:#fff;font-weight:600}
  .year-item .cnt{margin-left:auto;font-size:11px;color:var(--ink-3)}
  .year-item.active .cnt{color:rgba(255,255,255,.7)}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    margin:0 6px 8px 0;padding:5px 11px;
    border:1px solid var(--line);border-radius:999px;
    font-size:12px;color:var(--ink-2);cursor:pointer;background:rgba(255,255,255,.6);
    transition:all .15s;user-select:none;
  }
  .chip:hover{border-color:rgba(0,0,0,.2)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .legend{display:flex;flex-direction:column;gap:7px;padding:4px 6px}
  .legend div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.g{background:var(--green)} .dot.o{background:var(--orange)} .dot.gr{background:var(--gray)}
  /* Timeline */
  main{flex:1 1 auto;overflow-y:auto;padding:28px 40px 120px;scroll-padding-top:20px}
  .year-block{margin-bottom:14px}
  .year-head{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;gap:14px;
    padding:10px 0;margin-bottom:6px;
    background:linear-gradient(to bottom, rgba(245,245,247,.95) 70%, transparent);
  }
  .year-head h2{font-size:22px;font-weight:800;letter-spacing:.5px}
  .year-head .hline{flex:1;height:1px;background:var(--line)}
  .year-head .yc{font-size:12px;color:var(--ink-3)}
  .entries{position:relative;padding-left:34px}
  .entries::before{
    content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(to bottom, rgba(0,0,0,.14), rgba(0,0,0,.05));
    border-radius:2px;
  }
  .entry{position:relative;margin-bottom:12px}
  .entry::before{
    content:"";position:absolute;left:-30px;top:22px;width:10px;height:10px;border-radius:50%;
    background:#fff;border:2px solid var(--ink-3);z-index:1;
  }
  .entry.st-handbook::before{border-color:var(--green)}
  .entry.st-pending::before{border-color:var(--gray)}
  .card{
    display:block;text-decoration:none;color:inherit;
    background:var(--glass);
    backdrop-filter:blur(14px) saturate(1.5);
    -webkit-backdrop-filter:blur(14px) saturate(1.5);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
    transition:transform .18s, box-shadow .18s, border-color .18s;
    cursor:pointer;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 14px 34px rgba(0,0,0,.09);border-color:rgba(0,0,0,.16)}
  .card.no-link{cursor:default}
  .card.no-link:hover{transform:none;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);border-color:var(--line)}
  .card-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .month{
    font-size:11px;font-weight:700;color:var(--ink-3);
    background:rgba(0,0,0,.05);border-radius:6px;padding:2px 8px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .term{font-size:15px;font-weight:700}
  .term-en{font-size:12.5px;color:var(--ink-3);font-weight:500}
  .badges{margin-left:auto;display:flex;gap:8px;align-items:center}
  .cat{
    font-size:11px;color:var(--ink-2);
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.5);
    white-space:nowrap;
  }
  .status{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);white-space:nowrap}
  .desc{margin-top:7px;font-size:13px;line-height:1.65;color:var(--ink-2)}
  .card .go{
    display:inline-flex;align-items:center;gap:4px;margin-top:8px;
    font-size:12px;font-weight:600;color:var(--ink);
  }
  .card .go svg{transition:transform .18s}
  .card:hover .go svg{transform:translateX(3px)}
  .pending-note{font-size:11px;color:var(--ink-3);margin-top:8px}
  .empty{padding:60px 0;text-align:center;color:var(--ink-3);font-size:14px}
  /* Toast */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:var(--ink);color:#fff;font-size:13px;
    padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  /* Responsive */
  @media (max-width:860px){
    body{overflow:auto;height:auto}
    .layout{flex-direction:column}
    aside{flex:0 0 auto;border-right:none;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px}
    .side-title,.legend{display:none}
    .year-item{white-space:nowrap}
    .year-item .cnt{display:none}
    main{overflow:visible;padding:20px 18px 80px}
  }
</style>
</head>

/* ================= 渲染 ================= */
const main = document.getElementById('main');
const yearsNav = document.getElementById('years');
const catsBox = document.getElementById('cats');
const qInput = document.getElementById('q');
let activeCat = null;

const CATS = [...new Set(DATA.map(d=>d.cat))];
const STATUS_LABEL = {handbook:'独立手册', pending:'待补齐'};
const STATUS_DOT = {handbook:'g', pending:'gr'};

// 类别 chips
function renderCats(){
  catsBox.innerHTML = '';
  const all = document.createElement('span');
  all.className = 'chip' + (activeCat===null?' on':'');
  all.textContent = '全部';
  all.onclick = ()=>{activeCat=null;renderCats();renderMain();};
  catsBox.appendChild(all);
  CATS.forEach(c=>{
    const el = document.createElement('span');
    el.className = 'chip' + (activeCat===c?' on':'');
    el.textContent = c;
    el.onclick = ()=>{activeCat=(activeCat===c?null:c);renderCats();renderMain();};
    catsBox.appendChild(el);
  });
}

// 年份导航
function renderYears(){
  const counts = {};
  DATA.forEach(d=>counts[d.y]=(counts[d.y]||0)+1);
  const years = [...new Set(DATA.map(d=>d.y))].sort();
  yearsNav.innerHTML = years.map(y=>
    `<a class="year-item" data-y="${y}" href="#y${y}">${y}<span class="cnt">${counts[y]}</span></a>`
  ).join('');
  yearsNav.querySelectorAll('.year-item').forEach(a=>{
    a.addEventListener('click',()=>setActiveYear(a.dataset.y));
  });
}
function setActiveYear(y){
  yearsNav.querySelectorAll('.year-item').forEach(a=>a.classList.toggle('active',a.dataset.y==String(y)));
}

// 卡片
function cardHTML(d){
  const linked = d.status==='handbook' && d.link;
  const badge = `<span class="status"><span class="dot ${STATUS_DOT[d.status]}"></span>${STATUS_LABEL[d.status]}</span>`;
  const go = linked
    ? `<span class="go">查看手册 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>`
    : `<div class="pending-note">专属详情页待补齐 · 将按 handbook 结构编写</div>`;
  return `<div class="entry st-${d.status}">
    <a class="card ${linked?'':'no-link'}" ${linked?`href="${d.link}"${d.link.startsWith('http')?' target="_blank" rel="noopener"':''}`:`data-pending="1"`}>
      <div class="card-top">
        <span class="month">${d.m}</span>
        <span class="term">${d.term}</span>
        <span class="term-en">${d.en}</span>
        <span class="badges"><span class="cat">${d.cat}</span>${badge}</span>
      </div>
      <div class="desc">${d.desc}</div>
      ${go}
    </a>
  </div>`;
}

function renderMain(){
  const q = qInput.value.trim().toLowerCase();
  const filtered = DATA.filter(d=>{
    if(activeCat && d.cat!==activeCat) return false;
    if(q && !(d.term+d.en+d.desc+d.cat).toLowerCase().includes(q)) return false;
    return true;
  });
  const years = [...new Set(filtered.map(d=>d.y))].sort();
  if(!years.length){
    main.innerHTML = `<div class="empty">没有匹配的热词，试试调整搜索或筛选条件</div>`;
    return;
  }
  main.innerHTML = years.map(y=>{
    const items = filtered.filter(d=>d.y===y);
    return `<section class="year-block" id="y${y}">
      <div class="year-head"><h2>${y}</h2><span class="hline"></span><span class="yc">${items.length} 个热词</span></div>
      <div class="entries">${items.map(cardHTML).join('')}</div>
    </section>`;
  }).join('');
  bindPending();
  observeYears();
}

// 待补齐点击提示
const toast = document.getElementById('toast');
let toastTimer = null;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'),2200);
}
function bindPending(){
  main.querySelectorAll('[data-pending]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.preventDefault();
      showToast('该热词的专属详情页尚未补齐，敬请期待');
    });
  });
}

// 滚动联动年份高亮
let observer = null;
function observeYears(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting) setActiveYear(en.target.id.replace('y',''));
    });
  },{root:main,rootMargin:'-10% 0px -75% 0px'});
  main.querySelectorAll('.year-block').forEach(s=>observer.observe(s));
}

qInput.addEventListener('input',renderMain);

renderCats();
renderYears();
renderMain();
setActiveYear(2022);
</script>
</body>
</html>
